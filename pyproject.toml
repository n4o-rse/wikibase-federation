[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikibase-qs-api-importer"
version = "1.2.4"
description = "Import QuickStatements-like item triples into a Wikibase via the API, including federated Wikidata properties and item values."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.31.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
wb-qs-import = "main:main"

[tool.setuptools]
packages = ["wbqs"]
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Use-case scripts bootstrap sys.path before importing model / wbqs.
"usecases/**/*.py" = ["E402", "I001"]
# The chublets push keeps long, readable lines (messages, test fixtures).
"usecases/chublets/*.py" = ["E402", "I001", "E501"]
"tests/test_chublets_push.py" = ["E501"]
