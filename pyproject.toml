[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikibase-qs-api-importer"
version = "1.0.0"
description = "Import QuickStatements-like item triples into a Wikibase via the API, including federated Wikidata item values."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.31.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
wb-qs-import = "import_qs_api:main"

[tool.setuptools]
py-modules = ["import_qs_api", "qs_parser"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
