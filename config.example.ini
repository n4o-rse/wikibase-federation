; Copy this file to config.ini and fill in your credentials.
; config.ini is git-ignored and must never be committed.
;
; Credentials can also be provided via environment variables, which override
; the values below: WIKIBASE_USERNAME, WIKIBASE_PASSWORD

[wikibase]
api_url = https://federated-objects.de/w/api.php

; Bot password (Special:BotPasswords). Username looks like "MainAccount@botname".
username = YOUR_USERNAME
password = YOUR_BOT_PASSWORD

; Descriptive User-Agent (MediaWiki API etiquette). Add contact info if you can.
user_agent = wikibase-qs-api-importer/1.1 (you@example.org)

[job]
; Which job to run. Point to a job FOLDER (recommended): the importer runs the
; .qs file inside it (input.qs, or the single *.qs present) and writes reports to
; <folder>/report. Relative paths are resolved next to this config file.
job_dir = testcases/example

; Alternatively, point directly at a .qs file (takes precedence over job_dir):
; qs_file = testcases/example/input.qs

[import]
; true = only print parsed statements, write nothing. Recommended for first runs.
dry_run = true

; Skip statements whose exact (property, value) already exists on the item.
skip_existing = true

; maxlag seconds for writes (0 disables). Relevant on replicated backends only.
maxlag = 0

; Mark edits with the bot flag (requires the bot right).
mark_bot = false

; Seconds to sleep between successful writes (basic politeness).
throttle_seconds = 0.0

[run]
; Default run mode / flags (CLI flags override these).
; pipeline = true runs the job folder's pipeline.py (create item -> build QS ->
; import) instead of a plain import. Use --no-pipeline to force a plain import.
pipeline = true

; Only import the first N statements (0 = all). Handy for a first live test.
limit = 0

; Treat bare Q-IDs / P-IDs as Wikidata entities (usually false).
federate_bare_qids = false
federate_bare_pids = false

; Verbose (DEBUG) logging.
verbose = false

[chublets]
; Use case usecases/chublets: push the CSV model of chublets-wikibase-demo (S7g of wikibase-static).
; Folder of the demo repository (relative paths resolve next to this file).
source_dir = ../chublets-wikibase-demo
; Name of the target, used for idmap-<target>.csv and state-<target>.json. MUST be set for --write
; (and [wikibase] api_url must point at that wiki, not at federated-objects.de).
target =
; federated = a Wikidata stub of the CSV becomes the federated value wd:Q... (default);
; local = stubs are created as items in the target. Properties are always local.
values = federated
; Fall back from datatype url to string (as on federated-objects.de).
url_as_string = true
; same = Q1 to Q3 and P1 to P10 must come out with the ids of the CSV (a target that is empty);
; any = the target may already hold entities: use adopt-<target>.csv for the ones that exist, the rest
; gets the next free ids (recorded in idmap-<target>.csv).
core_ids = same
; Safety: without this, --write is ignored and every run is a dry run.
allow_write = false
