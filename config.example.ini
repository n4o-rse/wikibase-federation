; Copy this file to config.ini and fill in your credentials.
; config.ini is git-ignored and must never be committed.
;
; Credentials can also be provided via environment variables, which override
; the values below:
;   WIKIBASE_USERNAME, WIKIBASE_PASSWORD

[wikibase]
api_url = https://federated-objects.de/w/api.php

; Use a Bot password (Special:BotPasswords). The username then looks like
; "MainAccount@botname" and the password is the generated token.
username = YOUR_USERNAME
password = YOUR_BOT_PASSWORD

; Descriptive User-Agent (MediaWiki API etiquette). Add contact info if you can.
user_agent = wikibase-qs-api-importer/1.0 (you@example.org)

[import]
; Directory that holds your .qs input files.
data_dir = /root/data

; Directory where per-run JSON reports are written (created if missing).
report_dir = /root/report

; Default input file. Looked up inside data_dir (or given as an absolute path).
; Leave empty to auto-pick the single .qs file in data_dir, or to fall back to
; the bundled example.qs when data_dir is empty.
input_file = example.qs

; If true, only print parsed statements; perform no writes. Recommended for the
; first run. Can also be forced per-run with --dry-run.
dry_run = true

; If true, skip statements whose exact (property, value) already exists.
skip_existing = true

; maxlag in seconds for write requests (0 disables it). Relevant on replicated
; / shared infrastructure such as Wikidata; harmless on a private Wikibase.
maxlag = 0

; Mark edits with the bot flag (requires the bot right on the account).
mark_bot = false

; Seconds to sleep between successful writes (basic politeness / rate limiting).
throttle_seconds = 0.0